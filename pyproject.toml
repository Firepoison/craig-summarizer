[project]
name = "craig-summarizer"
version = "0.1.0"
description = "A discord bot that can take audio summarization from tools such as Craig, and generate a summary of the audio transcription."
authors = [
    { name = "Adam Barton", email = "firepoisonx@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llvmlite>=0.43.0",
    "numba>=0.60.0",
    "openai-whisper>=20240930",
    "google-genai>=1.74.0",
    "rich>=15.0.0",
    "mutagen>=1.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
